server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: serilog
    static_configs:
      - targets: [localhost]
        labels:
          job: serilog
          __path__: /logs/*.json
    pipeline_stages:
      - json:
          expressions:
            timestamp: Timestamp
            level: Level
            message: Message
      - labels:
          level: ""
